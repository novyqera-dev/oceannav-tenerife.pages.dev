name: Validate and deploy OceanNav PRO
on:
  push:
    branches: [main, feature/oceannav-pro]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oceannav-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  deploy:
    name: Test and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Deploy tested PWA
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ github.ref_name == 'main' && 'deploy' || 'versions upload --preview-alias oceanpro' }}
